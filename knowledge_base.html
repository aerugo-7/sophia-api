<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOPHIA - KNOWLEDGE BASE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Markdown 解析库，用于处理 *加粗* -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 像素字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* --- 全局与复古设定 --- */
        * { box-sizing: border-box; }
        body, html { width: 100%; min-height: 100%; background-color: #050510; color: #d1d5db; margin: 0; font-family: 'Microsoft YaHei', serif; }
        .pixel-font { font-family: 'Press Start 2P', cursive !important; image-rendering: pixelated; text-transform: uppercase; }
        
        /* 覆盖层：噪点与CRT扫描线 */
        .noise-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url("https://media.giphy.com/media/oEI9uWUicfG5m/giphy.gif"); opacity: 0.03; pointer-events: none; z-index: 999; }
        .crt-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); background-size: 100% 4px, 4px 100%; pointer-events: none; z-index: 1000; }
        
        /* 页面背景（动态加载） */
        .page-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-repeat: no-repeat; background-position: center center; background-size: cover; 
            filter: blur(4px) brightness(0.2); z-index: 0; 
            transition: opacity 0.5s ease-in-out; /* 背景切换丝滑过渡 */
        }

        /* --- 卡片通用样式 (Bento Grid) --- */
        .pixel-card {
            position: relative; background: rgba(15, 15, 20, 0.7); backdrop-filter: blur(8px);
            border: 2px solid #3b82f6; box-shadow: 6px 6px 0px rgba(0, 0, 255, 0.3);
            padding: 24px; transition: box-shadow 0.3s ease; overflow: hidden;
        }
        .pixel-card:hover { box-shadow: 6px 6px 0px rgba(250, 204, 21, 0.6); border-color: #facc15; }
        
        /* 特定板块颜色区分 */
        .card-red { border-color: #ef4444; box-shadow: 6px 6px 0px rgba(239, 68, 68, 0.3); }
        .card-yellow { border-color: #facc15; box-shadow: 6px 6px 0px rgba(250, 204, 21, 0.3); }

        /* --- Update 按钮与翻转动画 --- */
        .update-btn {
            position: absolute; top: 10px; right: 10px; background: #1e3a8a; color: #fff;
            border: 2px solid #fff; padding: 4px 8px; font-size: 8px; cursor: pointer;
            transition: all 0.2s; z-index: 10;
        }
        .update-btn:hover { background: #facc15; color: #000; }

        /* 淡出+轻微缩小 */
        .flip-out {
            animation: fadeOutScale 0.3s ease forwards;
        }
        .flip-in {
            animation: fadeInScale 0.3s ease forwards;
        }
        @keyframes fadeOutScale {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.95); }
        }
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Markdown 渲染样式强化 */
        .md-content strong { color: #facc15; font-weight: bold; text-shadow: 1px 1px 0px #000; }
        .md-content em { color: #60a5fa; font-style: normal; border-bottom: 1px dashed #60a5fa; }
        
        /* 思想八卦专用的圆形卡片容器 */
        .gossip-circle { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #ef4444; object-fit: cover; }
        .gossip-line { height: 2px; flex-grow: 1; background: repeating-linear-gradient(90deg, #ef4444, #ef4444 4px, transparent 4px, transparent 8px); }

        /* 顶部导航栏 */
        nav { background: rgba(0,0,0,0.8); border-bottom: 2px solid #3b82f6; }
        nav a { color: #aaa; text-decoration: none; padding: 10px 15px; font-size: 10px; transition: 0.3s; }
        nav a:hover, nav a.active { color: #facc15; text-shadow: 2px 2px 0px #000; }
    </style>
</head>
<body class="relative min-h-screen pb-20">
    <!-- 全局背景刷新按钮 (左上角悬浮) -->
    <button onclick="refreshBackground()" class="fixed top-4 left-4 z-[1001] pixel-font bg-gray-900 text-yellow-500 border-2 border-yellow-500 px-3 py-2 text-xs hover:bg-yellow-500 hover:text-black transition-colors cursor-pointer shadow-[4px_4px_0_0_#000]">
        REFRESH BACKGROUND
    </button>

    <!-- 动态背景层 (去掉了 CSS 中的静态绑定) -->
    <div id="dynamic-bg" class="page-bg" style="background-image: url('static/pic/bg.png');"></div>

    <div class="noise-overlay"></div>
    <div class="crt-overlay"></div>

    <!-- 导航栏 -->
    <nav class="sticky top-0 w-full z-50 flex justify-center py-4 pixel-font shadow-lg backdrop-blur-md">
        <a href="index.html" class="hover:text-yellow-400">HOME</a>
        <a href="knowledge_base.html" class="active">KNOWLEDGE</a>
        <a href="gallery.html">GALLERY</a>
        <a href="universe.html">UNIVERSE</a>
        <a href="agent_lab.html">LAB</a>
    </nav>

    <!-- 主体网格布局 -->
    <div class="max-w-7xl mx-auto mt-8 px-6 space-y-6 relative z-10">
        
        <!-- Row 1: 金句 (1/4) | 核心插图 (2/4) | 杂谈 (1/4) -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- 金句模块 -->
            <div id="card-quotes" class="pixel-card card-yellow col-span-1 flex flex-col h-96">
                <button class="pixel-font update-btn" onclick="refreshCard('quotes')">UPDATE</button>
                <h3 class="pixel-font text-yellow-400 mb-4 text-xs"># DAILY QUOTES</h3>
                <div id="content-quotes" class="flex-1 overflow-y-auto space-y-4 md-content text-sm">
                    <!-- 内容由JS注入 -->
                </div>
            </div>

            <!-- 核心配图模块 -->
            <div id="card-main-pic" class="pixel-card col-span-2 p-2 h-96 flex items-center justify-center bg-black">
                <button class="pixel-font update-btn" onclick="refreshCard('main-pic')">UPDATE</button>
                <img id="content-main-pic" src="" alt="Decoration" class="w-full h-full object-cover border-2 border-gray-700 opacity-80 hover:opacity-100 transition-opacity">
            </div>

            <!-- 杂谈模块 -->
            <div id="card-stories" class="pixel-card col-span-1 flex flex-col h-96">
                <button class="pixel-font update-btn" onclick="refreshCard('stories')">UPDATE</button>
                <h3 class="pixel-font text-blue-400 mb-4 text-xs"># SHORT TALES</h3>
                <div id="content-stories" class="flex-1 overflow-y-auto space-y-4 md-content text-sm">
                    <!-- 内容由JS注入 -->
                </div>
            </div>
        </div>

        <!-- Row 2: 哲学家画像 (2/3) | 学个概念 (1/3) -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div id="card-philosopher" class="pixel-card col-span-2 flex flex-row h-72">
                <button class="pixel-font update-btn" onclick="refreshCard('philosopher')">UPDATE</button>
                <div class="w-1/3 flex flex-col items-center justify-center border-r border-gray-700 pr-6">
                    <img id="content-philo-img" src="" class="w-40 h-40 object-cover border-2 border-yellow-500 mb-4 shadow-[4px_4px_0_0_rgba(250,204,21,0.5)]">
                    <h3 id="content-philo-name" class="font-bold text-xl text-white tracking-widest text-center"></h3>
                    <span id="content-philo-era" class="text-xs text-gray-500 mt-1"></span>
                </div>
                <div class="w-2/3 pl-6 overflow-y-auto md-content flex flex-col justify-center">
                    <h3 class="pixel-font text-yellow-400 mb-3 text-xs"># PROFILE</h3>
                    <div id="content-philo-desc" class="text-sm leading-relaxed text-gray-300"></div>
                </div>
            </div>

            <div id="card-concept" class="pixel-card col-span-1 h-72 flex flex-col">
                <button class="pixel-font update-btn" onclick="refreshCard('concept')">UPDATE</button>
                <h3 class="pixel-font text-green-400 mb-4 text-xs"># CORE TOPIC</h3>
                <h4 id="content-concept-name" class="text-lg font-bold text-white mb-2"></h4>
                <div id="content-concept-desc" class="md-content text-sm overflow-y-auto text-gray-400"></div>
            </div>
        </div>

        <!-- Row 3: 时代流变 (1/2) | 流派展示 (1/2) -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div id="card-era" class="pixel-card p-0 h-64 relative group">
                <button class="pixel-font update-btn" onclick="refreshCard('era')">UPDATE</button>
                <img id="content-era-bg" src="" class="absolute inset-0 w-full h-full object-cover opacity-30 group-hover:opacity-50 transition-opacity">
                <div class="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent p-6 flex flex-col justify-end">
                    <h3 class="pixel-font text-purple-400 mb-2 text-xs"># ERA EVOLUTION</h3>
                    <h4 id="content-era-name" class="text-xl font-bold text-white mb-2"></h4>
                    <div id="content-era-desc" class="md-content text-xs text-gray-300 line-clamp-3"></div>
                </div>
            </div>

            <div id="card-school" class="pixel-card h-64 flex items-center">
                <button class="pixel-font update-btn" onclick="refreshCard('school')">UPDATE</button>
                <img id="content-school-icon" src="" class="w-32 h-32 mr-6 border-2 border-blue-500">
                <div class="flex-1">
                    <h3 class="pixel-font text-blue-400 mb-2 text-xs"># SCHOOL OF THOUGHT</h3>
                    <h4 id="content-school-name" class="text-xl font-bold text-white mb-2"></h4>
                    <div id="content-school-desc" class="md-content text-xs text-gray-400 line-clamp-4"></div>
                </div>
            </div>
        </div>

        <!-- Row 4: 思想八卦 (圆形社交链) -->
        <div id="card-gossip" class="pixel-card card-red w-full py-8">
            <button class="pixel-font update-btn" onclick="refreshCard('gossip')">UPDATE</button>
            <h3 class="pixel-font text-red-400 mb-6 text-xs text-center"># PHILO GOSSIP</h3>
            <div class="flex items-center justify-center max-w-4xl mx-auto px-4">
                <div class="flex flex-col items-center">
                    <img id="gossip-img-1" src="" class="gossip-circle">
                    <span id="gossip-name-1" class="mt-2 text-xs font-bold text-white"></span>
                </div>
                <div class="gossip-line mx-4 relative">
                    <div id="gossip-relation" class="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-red-900 text-white px-3 py-1 rounded text-xs whitespace-nowrap"></div>
                </div>
                <div class="flex flex-col items-center">
                    <img id="gossip-img-2" src="" class="gossip-circle">
                    <span id="gossip-name-2" class="mt-2 text-xs font-bold text-white"></span>
                </div>
            </div>
            <div id="gossip-desc" class="text-center mt-6 text-sm md-content text-gray-400 max-w-2xl mx-auto"></div>
        </div>

        <!-- Row 5: 思想实验 -->
        <div id="card-experiment" class="pixel-card card-red flex h-80 p-0">
            <button class="pixel-font update-btn" onclick="refreshCard('experiment')">UPDATE</button>
            <div class="w-1/3 bg-black">
                <img id="content-exp-img" src="" class="w-full h-full object-cover opacity-80">
            </div>
            <div class="w-2/3 p-8 flex flex-col justify-center">
                <h3 class="pixel-font text-red-400 mb-4 text-xs"># THOUGHT EXPERIMENT</h3>
                <h4 id="content-exp-name" class="text-2xl font-bold text-white mb-4"></h4>
                <div id="content-exp-desc" class="md-content text-sm text-gray-300 leading-relaxed overflow-y-auto"></div>
            </div>
        </div>

    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000/sophia/api";

        // 工具函数：为 DOM 元素触发翻转动画
        function triggerFlipAnimation(elementId, updateCallback) {
            const el = document.getElementById(elementId);
            // 移除旧动画，触发重新重绘
            el.classList.remove('flip-in', 'flip-out');
            void el.offsetWidth; 
            
            // 执行翻出动画
            el.classList.add('flip-out');
            
            // 在翻出动画结束（画面消失）时，更新数据，然后执行翻入动画
            setTimeout(() => {
                updateCallback().then(() => {
                    el.classList.remove('flip-out');
                    el.classList.add('flip-in');
                });
            }, 300); // 必须与 CSS 动画时长一致
        }

        // --- 数据获取与渲染逻辑 ---

        async function fetchQuotes() {
            try {
                // 向 unified_api 请求 3 条金句
                const res = await fetch(API_BASE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "get_content", params: { type: "金句", limit: 3 }}) });
                const data = await res.json();
                let html = "";
                data.data.forEach(item => {
                    // 使用 marked.parse 解析 markdown
                    html += `<div class="border-l-2 border-yellow-600 pl-3 mb-4"><div class="italic text-gray-300">"${marked.parseInline(item.text)}"</div><div class="text-right text-xs text-yellow-600 mt-1">— ${item.author} 《${item.title}》</div></div>`;
                });
                document.getElementById('content-quotes').innerHTML = html;
            } catch (e) { console.error(e); }
        }

        async function fetchStories() {
            try {
                const res = await fetch(API_BASE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "get_content", params: { type: "小故事", limit: 3 }}) });
                const data = await res.json();
                let html = "";
                data.data.forEach(item => {
                    html += `<div class="bg-gray-800 p-3 rounded mb-3"><div class="text-gray-300 text-xs">${marked.parseInline(item.text)}</div></div>`;
                });
                document.getElementById('content-stories').innerHTML = html;
            } catch (e) { console.error(e); }
        }

        async function fetchMainPic() {
            try {
                const res = await fetch(API_BASE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "get_decoration" }) });
                const data = await res.json();
                if(data.image_path) {
                    document.getElementById('content-main-pic').src = data.image_path;
                }
            } catch (e) { console.error(e); }
        }

        async function fetchPhilosopher() {
            try {
                const res = await fetch(API_BASE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "get_random", params: { target: "philosopher" }}) });
                const data = await res.json();
                document.getElementById('content-philo-name').innerText = data.name;
                document.getElementById('content-philo-era').innerText = data.era;
                document.getElementById('content-philo-desc').innerHTML = marked.parse(data.description || "无记录");
                document.getElementById('content-philo-img').src = `static/avatars/avatar_${data.id}.png`;
            } catch (e) { console.error(e); }
        }

        async function fetchConcept() {
            try {
                const res = await fetch(API_BASE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "get_random", params: { target: "topic" }}) });
                const data = await res.json();
                document.getElementById('content-concept-name').innerText = data.topic_name;
                document.getElementById('content-concept-desc').innerHTML = marked.parse(data.description || "无记录");
            } catch (e) { console.error(e); }
        }

        async function fetchEra() {
            try {
                const res = await fetch(API_BASE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "get_random", params: { target: "era" }}) });
                const data = await res.json();
                document.getElementById('content-era-name').innerText = data.name;
                document.getElementById('content-era-desc').innerHTML = marked.parse(data.era_summary || "");
                document.getElementById('content-era-bg').src = `static/eras/era_${data.id}.png`;
            } catch (e) { console.error(e); }
        }

        async function fetchSchool() {
            try {
                const res = await fetch(API_BASE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "get_random", params: { target: "school" }}) });
                const data = await res.json();
                document.getElementById('content-school-name').innerText = data.name;
                document.getElementById('content-school-desc').innerHTML = marked.parse(data.description || "");
                document.getElementById('content-school-icon').src = `static/schools/school_${data.id}.png`;
            } catch (e) { console.error(e); }
        }

        async function fetchGossip() {
            try {
                const res = await fetch(API_BASE, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ action: "get_random", params: { target: "gossip" }}) 
                });
                const data = await res.json();
                
                // 1. 设置名字
                document.getElementById('gossip-name-1').innerText = data.source;
                document.getElementById('gossip-name-2').innerText = data.target;
                document.getElementById('gossip-relation').innerText = data.relation;
                
                // 2. 【关键修改】：使用 ID 拼接头像路径
                document.getElementById('gossip-img-1').src = `static/avatars/avatar_${data.source_id}.png`;
                document.getElementById('gossip-img-2').src = `static/avatars/avatar_${data.target_id}.png`;
                
                // 3. 渲染描述
                document.getElementById('gossip-desc').innerHTML = marked.parse(data.description || "逻辑连通中...");
            } catch (e) { console.error("Gossip 加载失败", e); }
        }

        async function fetchExperiment() {
            try {
                const res = await fetch(API_BASE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "get_random", params: { target: "experiment" }}) });
                const data = await res.json();
                document.getElementById('content-exp-name').innerText = data.name;
                document.getElementById('content-exp-desc').innerHTML = marked.parse(data.description || "");
                document.getElementById('content-exp-img').src = `static/experiments/exp_${data.id}.png`;
            } catch (e) { console.error(e); }
        }

        // --- 动态背景刷新逻辑 ---
        async function fetchBackground() {
            try {
                const res = await fetch(API_BASE, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ action: "get_decoration" }) 
                });
                const data = await res.json();
                if(data.image_path) {
                    // 为背景切换增加平滑的渐变过渡效果
                    const bgEl = document.getElementById('dynamic-bg');
                    bgEl.style.opacity = 0; // 先变黑
                    
                    setTimeout(() => {
                        bgEl.style.backgroundImage = `url('${data.image_path}')`;
                        bgEl.style.opacity = 1; // 再亮起
                    }, 500);
                }
            } catch (e) { console.error(e); }
        }

        // 绑定给左上角按钮
        function refreshBackground() {
            fetchBackground();
        }

        // --- 全局控制与按钮绑定 ---

        const cardUpdateMap = {
            'quotes': fetchQuotes,
            'stories': fetchStories,
            'main-pic': fetchMainPic,
            'philosopher': fetchPhilosopher,
            'concept': fetchConcept,
            'era': fetchEra,
            'school': fetchSchool,
            'gossip': fetchGossip,
            'experiment': fetchExperiment
        };

        function refreshCard(cardKey) {
            triggerFlipAnimation('card-' + cardKey, cardUpdateMap[cardKey]);
        }

        // 页面初始化：加载所有数据 + 随机背景
        window.onload = () => {
            fetchBackground(); // 页面一打开就随机一个背景
            Object.values(cardUpdateMap).forEach(fn => fn());
        };
    </script>
</body>
</html>
